[project]
name = "legisqa"
version = "0.1.0"
description = "Grounded Q&A over Australian legislation: verified citations, safe abstain and prompt-injection defences."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rank-bm25>=0.2.2",
]

[project.scripts]
legisqa = "legisqa.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legisqa"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]
extend-exclude = ["frontend", "tmp", "data"]

[tool.ruff.lint]
# PLC0415 forbids imports inside functions; S is the bandit security rule set.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/verify.py" = ["S603"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["rank_bm25"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["legisqa"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
